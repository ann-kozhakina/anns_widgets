<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Виджеты Ann</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{--bg:#F4F6F3;--card:#FFFFFF;--ink:#1D2A29;--ink2:#566361;--line:#E1E6E2;--accent:#2C7A6B;
  --serif:"Prata",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#111716;--card:#18201F;--ink:#E4ECE9;--ink2:#B2BFBB;--line:#26302E;--accent:#62C3AE}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:40px 48px}
h1{font-family:var(--serif);font-weight:400;font-size:32px;margin:0 0 24px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
.card b{display:block;font-size:16px;font-weight:600;margin-bottom:4px}
.card span{color:var(--ink2);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Виджеты</h1>
  <div class="list">
    <a class="card" href="weight/"><b>Дневник веса</b><span>Вес, уколы, ночной пульс и замеры</span></a>
  </div>
</div>
</body>
</html>
